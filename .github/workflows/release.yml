name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version/tag (for example 1.0.0 or v1.0.0)"
        required: true
        type: string
      release_name:
        description: "Release name shown on GitHub"
        required: true
        type: string
      release_notes:
        description: "Extra release notes (optional)"
        required: false
        type: string
        default: ""
      prerelease:
        description: "Mark as a pre-release"
        required: true
        type: boolean
        default: false
      draft:
        description: "Create as a draft"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  copilot-requests: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate and prepare release
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="$VERSION_INPUT"
          VERSION="${VERSION#v}"
          VERSION="${VERSION#V}"

          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION_INPUT"
            exit 1
          fi

          TAG="v$VERSION"
          mkdir -p dist

          for name in wifi bluetooth network audio display power system users storage software security; do
            cp "$name.sh" "dist/$name"
            chmod 755 "dist/$name"
            bash -n "$name.sh"
          done

          cp install.sh dist/install.sh
          chmod 755 dist/install.sh
          bash -n install.sh

          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Check release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "A release already exists for $TAG."
            exit 1
          fi

      - name: Find previous release tag
        shell: bash
        run: |
          set -euo pipefail
          previous_tag="$(git tag --sort=-version:refname | grep -E '^v[0-9]+(\.[0-9]+){1,2}([.-][0-9A-Za-z.-]+)?$' | head -n 1 || true)"

          if [[ -n "$previous_tag" ]]; then
            echo "PREVIOUS_TAG=$previous_tag" >> "$GITHUB_ENV"
          else
            echo "PREVIOUS_TAG=" >> "$GITHUB_ENV"
          fi

      - name: Build commit list
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${PREVIOUS_TAG:-}" ]]; then
            git log --no-merges --format='- %h %s (%an)' "$PREVIOUS_TAG..HEAD" > commits.txt
          else
            git log --no-merges --format='- %h %s (%an)' HEAD > commits.txt
          fi

          [[ -s commits.txt ]] || echo "- No new commits since the previous release." > commits.txt

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Generate AI commit summary
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          {
            echo "You are writing release notes for linux-simple-utils."
            echo "Summarize ALL commits listed below since the previous release."
            echo "Group related changes where useful."
            echo "Do not invent features or details."
            echo "Return ONLY concise Markdown bullet points, such as 'Improved', 'Removed', 'Changed', or 'Fixed'."
            echo
            echo "Commits:"
            cat commits.txt
          } > ai-prompt.txt

          copilot -p "$(cat ai-prompt.txt)" -s > ai-summary.txt
          [[ -s ai-summary.txt ]] || exit 1

      - name: Build release notes
        shell: bash
        env:
          EXTRA_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail

          {
            echo "## Install"
            echo
            echo '```bash'
            echo 'curl -fsSL https://github.com/MegaCode111REAL/linux-simple-utils/releases/latest/download/install.sh | bash'
            echo '```'
            echo
            echo "## What's new"
            echo

            if [[ -s ai-summary.txt ]]; then
              cat ai-summary.txt
            else
              cat commits.txt
            fi

            if [[ -n "$EXTRA_NOTES" ]]; then
              echo
              echo "## Additional notes"
              echo
              printf '%s\n' "$EXTRA_NOTES"
            fi
          } > release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ inputs.release_name }}
          PRERELEASE: ${{ inputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail

          args=(
            "$TAG"
            dist/wifi dist/bluetooth dist/network dist/audio dist/display
            dist/power dist/system dist/users dist/storage dist/software dist/security
            dist/install.sh
            --repo "${{ github.repository }}"
            --title "$RELEASE_NAME"
            --notes-file release-notes.md
          )

          [[ "$PRERELEASE" == "true" ]] && args+=(--prerelease)
          [[ "$DRAFT" == "true" ]] && args+=(--draft)

          gh release create "${args[@]}"
