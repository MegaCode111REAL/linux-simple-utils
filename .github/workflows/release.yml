name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version/tag (for example 1.0.0 or v1.0.0)"
        required: true
        type: string
      release_name:
        description: "Release name shown on GitHub"
        required: true
        type: string
      release_notes:
        description: "Release notes"
        required: false
        type: string
        default: ""
      prerelease:
        description: "Mark as a pre-release"
        required: true
        type: boolean
        default: false
      draft:
        description: "Create as a draft"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate and prepare release
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          VERSION="$VERSION_INPUT"
          VERSION="${VERSION#v}"
          VERSION="${VERSION#V}"

          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION_INPUT"
            echo "Use a version such as 1.0.0, v1.0.0, or 1.0.0-beta.1."
            exit 1
          fi

          TAG="v$VERSION"
          mkdir -p dist

          for name in wifi bluetooth network audio display power system users storage software security; do
            cp "$name.sh" "dist/$name"
            chmod 755 "dist/$name"
            bash -n "$name.sh"
          done

          cp install.sh dist/install.sh
          chmod 755 dist/install.sh
          bash -n install.sh

          printf '%s\n' "$RELEASE_NOTES" > release-notes.md
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Check release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "A release already exists for $TAG."
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ inputs.release_name }}
          PRERELEASE: ${{ inputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail

          args=(
            "$TAG"
            dist/wifi
            dist/bluetooth
            dist/network
            dist/audio
            dist/display
            dist/power
            dist/system
            dist/users
            dist/storage
            dist/software
            dist/security
            dist/install.sh
            --repo "${{ github.repository }}"
            --title "$RELEASE_NAME"
            --notes-file release-notes.md
          )

          [[ "$PRERELEASE" == "true" ]] && args+=(--prerelease)
          [[ "$DRAFT" == "true" ]] && args+=(--draft)

          gh release create "${args[@]}"
