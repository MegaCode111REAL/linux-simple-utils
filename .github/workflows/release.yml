name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version/tag (for example 1.0.0 or v1.0.0)"
        required: true
        type: string
      release_name:
        description: "Release name shown on GitHub"
        required: true
        type: string
      release_notes:
        description: "Release notes"
        required: false
        type: string
        default: ""
      prerelease:
        description: "Mark as a pre-release"
        required: true
        type: boolean
        default: false
      draft:
        description: "Create as a draft"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    env:
      VERSION_INPUT: ${{ inputs.version }}
      RELEASE_NAME: ${{ inputs.release_name }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
      PRERELEASE: ${{ inputs.prerelease }}
      DRAFT: ${{ inputs.draft }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate and prepare release
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$VERSION_INPUT"
          VERSION="${VERSION#v}"
          VERSION="${VERSION#V}"

          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION_INPUT"
            echo "Use a version such as 1.0.0, v1.0.0, or 1.0.0-beta.1."
            exit 1
          fi

          TAG="v$VERSION"

          mkdir -p dist
          cp wifi.sh dist/wifi
          cp bluetooth.sh dist/bluetooth
          cp install.sh dist/install.sh

          chmod 755 dist/wifi dist/bluetooth dist/install.sh

          bash -n wifi.sh
          bash -n bluetooth.sh
          bash -n install.sh

          printf '%s\n' "${RELEASE_NOTES}" > release-notes.md

          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Check release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "A release already exists for $TAG."
            exit 1
          fi

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          args=(
            "$TAG"
            "dist/wifi"
            "dist/bluetooth"
            "dist/install.sh"
            --repo "${{ github.repository }}"
            --title "$RELEASE_NAME"
            --notes-file release-notes.md
          )

          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          if [[ "$DRAFT" == "true" ]]; then
            args+=(--draft)
          fi

          gh release create "${args[@]}"

          echo "Created release $TAG."
